<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Page introuvable — StationTrack</title>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
:root{
  --bg:var(--st-bg);--panel:var(--st-panel);--line:var(--st-line);
  --blue:var(--st-blue);--orange:var(--st-orange);--text:var(--st-text);--muted:var(--st-muted);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:24px;text-align:center;
}
.wrap{max-width:420px}
.code{font-size:72px;font-weight:800;color:var(--st-blue-text);margin:0 0 8px;line-height:1}
.brandlogo{
  width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#c25e00);
  display:grid;place-items:center;margin:0 auto 20px;
}
h1{font-size:20px;margin:0 0 10px}
p{color:var(--muted);font-size:14px;line-height:1.6;margin:0 0 28px}
.btn{
  display:inline-flex;align-items:center;gap:8px;background:var(--blue);color:white;font-weight:700;
  font-size:14px;padding:12px 24px;border-radius:10px;text-decoration:none;
}
.btn:hover{opacity:.92}
</style>
</head>
<body>
<div class="wrap">
  <div class="brandlogo"><svg viewBox="0 0 24 24" width="24" height="24" stroke="white" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z"/></svg></div>
  <div class="code">404</div>
  <h1>Page introuvable</h1>
  <p>La page que vous cherchez n'existe pas ou a été déplacée. Vérifiez l'adresse, ou retournez à votre espace de connexion.</p>
  {% if est_domaine_racine %}
  <a href="/" class="btn">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
    Retour à l'accueil
  </a>
  {% else %}
  <a href="/login/" class="btn">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M19 12H5"/><polyline points="12 19 5 12 12 5"/></svg>
    Retour à la connexion
  </a>
  {% endif %}
</div>
</body>
</html>
