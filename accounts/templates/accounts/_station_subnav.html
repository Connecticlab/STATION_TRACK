{% load formatage %}
<div class="station-subnav" id="stationSubnav">
  <a href="{% url 'accounts:admin_station_detail' station.pk %}?depuis_onglet=1"
     class="subnav-tab{% if onglet_actif == 'pompes' %} active{% endif %}"
     style="--tab-color:var(--orange);">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--tab-color)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="22" x2="15" y2="22"/><line x1="4" y1="9" x2="4" y2="22"/><line x1="10" y1="22" x2="10" y2="4"/><rect x="4" y="4" width="6" height="5" rx="1"/><path d="M10 9h4a2 2 0 0 1 2 2v7a1.5 1.5 0 0 0 3 0V7l-3-3"/></svg>
    Pompes
  </a>
  <a href="{% url 'accounts:admin_station_cuves' station.pk %}?depuis_onglet=1"
     class="subnav-tab{% if onglet_actif == 'cuves' %} active{% endif %}"
     style="--tab-color:var(--blue);">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--tab-color)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="5" rx="8" ry="3"/><path d="M4 5v14c0 1.66 3.58 3 8 3s8-1.34 8-3V5"/><path d="M4 12c0 1.66 3.58 3 8 3s8-1.34 8-3"/></svg>
    Cuves
  </a>
  <a href="{% url 'accounts:admin_station_jauges' station.pk %}?depuis_onglet=1"
     class="subnav-tab{% if onglet_actif == 'jauges' %} active{% endif %}"
     style="--tab-color:var(--green);">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--tab-color)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 20a8 8 0 1 0-8-8"/><line x1="12" y1="20" x2="12" y2="22"/><line x1="2" y1="12" x2="4" y2="12"/><path d="M12 12l4-4"/></svg>
    Jauges
  </a>
  <a href="{% url 'accounts:admin_station_historique' station.pk %}?depuis_onglet=1"
     class="subnav-tab{% if onglet_actif == 'historique' %} active{% endif %}"
     style="--tab-color:var(--yellow);">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--tab-color)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 3v5h5"/><path d="M3.05 13A9 9 0 1 0 6 5.3L3 8"/><polyline points="12 7 12 12 15 15"/></svg>
    Historique d'index
  </a>
  <a href="{% url 'accounts:admin_station_depenses' station.pk %}?depuis_onglet=1"
     class="subnav-tab{% if onglet_actif == 'depenses' %} active{% endif %}"
     style="--tab-color:var(--red);">
    <svg viewBox="0 0 24 24" width="16" height="16" stroke="var(--tab-color)" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="6" width="20" height="12" rx="2"/><circle cx="12" cy="12" r="3"/><line x1="6" y1="12" x2="6" y2="12.01"/><line x1="18" y1="12" x2="18" y2="12.01"/></svg>
    Historique de dépenses
  </a>
</div>

<button type="button" class="subnav-back" id="subnavBack">
  <svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><line x1="19" y1="12" x2="5" y2="12"/><polyline points="12 19 5 12 12 5"/></svg>
  Retour au menu
</button>

<script>
document.addEventListener('DOMContentLoaded', function(){
  var subnav = document.getElementById('stationSubnav');
  var contenu = document.getElementById('station-content');
  var actionsEntete = document.getElementById('station-head-actions');
  var sousTitre = document.getElementById('station-subtitle');
  var boutonRetour = document.getElementById('subnavBack');
  if (!subnav || !contenu) return;
  var ongletActif = subnav.querySelector('.subnav-tab.active');
  if (!ongletActif) return;

  function revelerContenu(){
    subnav.classList.add('content-open');
    contenu.classList.add('open');
    if (actionsEntete) actionsEntete.classList.add('open');
    if (sousTitre) sousTitre.classList.add('open');
    boutonRetour.classList.add('show');
  }

  function revenirAuMenu(){
    subnav.classList.remove('content-open');
    contenu.classList.remove('open');
    if (actionsEntete) actionsEntete.classList.remove('open');
    if (sousTitre) sousTitre.classList.remove('open');
    boutonRetour.classList.remove('show');
  }

  ongletActif.addEventListener('click', function(e){
    if (window.innerWidth > 900) return;
    e.preventDefault();
    revelerContenu();
  });

  boutonRetour.addEventListener('click', revenirAuMenu);

  // Arrivee depuis un AUTRE onglet (navigation reelle) — jamais repasser par
  // l'etape menu, revele directement le contenu de la page d'arrivee. Le menu
  // pur ne s'applique qu'au tout premier chargement direct de la fiche station.
  if (window.innerWidth <= 900 && window.location.search.indexOf('depuis_onglet=1') !== -1) {
    revelerContenu();
  }
});
</script>
