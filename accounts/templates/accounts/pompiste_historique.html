<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StationTrack — Historique</title>
{% load formatage %}
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
:root{
  --black:var(--st-bg);--panel:var(--st-panel);--line:var(--st-line);
  --blue:var(--st-blue);--white:var(--st-text);--muted:var(--st-muted);
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:var(--font-sans);background:var(--black);color:var(--white);transition:background .2s ease,color .2s ease}
body{padding:16px;padding-bottom:48px}
.wrap{max-width:560px;margin:0 auto}
.header{margin-bottom:18px;display:flex;justify-content:space-between;align-items:center}
.theme-toggle{
  width:38px;height:38px;border-radius:10px;border:1px solid var(--line);background:var(--panel);
  color:var(--white);cursor:pointer;display:flex;align-items:center;justify-content:center
}
.header h1{font-size:19px;margin:0}
.item{
  display:flex;justify-content:space-between;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  text-decoration:none;color:var(--white)
}
.item .date{font-size:14px;font-weight:700}
.item .montant{font-size:13px;color:var(--muted)}
.item .arrow{color:var(--blue);font-size:18px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13.5px}
.back{
  display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:14px;font-weight:700;
  text-decoration:none;height:52px;line-height:52px;border:1px solid var(--line);border-radius:12px
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header">
    <h1>Historique de mes caisses</h1>
    <button class="theme-toggle" id="themeToggle" type="button" aria-label="Changer de thème">
      <span id="themeIcon"><svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg></span>
    </button>
  </div>

  {% for session in sessions %}
    {% if session.montant_encaisse is not None %}
      <a class="item" href="{% url 'accounts:pompiste_recu' session.pk %}">
        <div>
          <div class="date">{{ session.date|date:"d/m/Y" }}</div>
          <div class="montant">{{ session.montant_encaisse|fcfa }} encaissés</div>
        </div>
        <span class="arrow">›</span>
      </a>
    {% endif %}
  {% empty %}
    <div class="empty">Aucune caisse clôturée pour l'instant.</div>
  {% endfor %}

  <a class="back" href="{% url 'accounts:pompiste_accueil' %}">Retour</a>
</div>
<script>
(function(){
  var toggle = document.getElementById('themeToggle');
  var iconWrap = document.getElementById('themeIcon');
  var iconSun = '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
  var iconMoon = '<svg viewBox="0 0 24 24" width="16" height="16" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

  function appliquerTheme(theme) {
    if (theme === 'light') {
      document.documentElement.setAttribute('data-theme', 'light');
      iconWrap.innerHTML = iconMoon;
    } else {
      document.documentElement.removeAttribute('data-theme');
      iconWrap.innerHTML = iconSun;
    }
  }

  var stocke = localStorage.getItem('stationtrack_theme');
  if (stocke) appliquerTheme(stocke);

  toggle.addEventListener('click', function(){
    var actuel = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
    var nouveau = actuel === 'light' ? 'dark' : 'light';
    appliquerTheme(nouveau);
    localStorage.setItem('stationtrack_theme', nouveau);
  });
})();
</script>
</body>
</html>
