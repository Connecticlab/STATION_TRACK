<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StationTrack — Historique</title>
{% load formatage %}
<style>
:root{
  --black:#070b10;--panel:#121a23;--line:#283542;
  --blue:#1769ff;--white:#f6f8fb;--muted:#8b98a8;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--black);color:var(--white)}
body{padding:16px;padding-bottom:48px}
.wrap{max-width:560px;margin:0 auto}
.header{margin-bottom:18px}
.header h1{font-size:19px;margin:0}
.item{
  display:flex;justify-content:space-between;align-items:center;background:var(--panel);
  border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin-bottom:10px;
  text-decoration:none;color:var(--white)
}
.item .date{font-size:14px;font-weight:700}
.item .montant{font-size:13px;color:var(--muted)}
.item .arrow{color:var(--blue);font-size:18px}
.empty{color:var(--muted);text-align:center;padding:40px 20px;font-size:13.5px}
.back{
  display:block;text-align:center;margin-top:16px;color:var(--muted);font-size:14px;font-weight:700;
  text-decoration:none;height:52px;line-height:52px;border:1px solid var(--line);border-radius:12px
}
</style>
</head>
<body>
<div class="wrap">
  <div class="header"><h1>Historique de mes caisses</h1></div>

  {% for session in sessions %}
    {% if session.montant_encaisse is not None %}
      <a class="item" href="{% url 'accounts:pompiste_recu' session.pk %}">
        <div>
          <div class="date">{{ session.date|date:"d/m/Y" }}</div>
          <div class="montant">{{ session.montant_encaisse|fcfa }} encaissés</div>
        </div>
        <span class="arrow">›</span>
      </a>
    {% endif %}
  {% empty %}
    <div class="empty">Aucune caisse clôturée pour l'instant.</div>
  {% endfor %}

  <a class="back" href="{% url 'accounts:pompiste_accueil' %}">Retour</a>
</div>
</body>
</html>
