<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{% block title %}StationTrack — Super Admin{% endblock %}</title>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
:root{
  --bg:var(--st-bg);--panel:var(--st-panel);--panel2:var(--st-panel-2);--line:var(--st-line);
  --blue:var(--st-blue);--orange:var(--st-orange);--green:var(--st-green);--red:var(--st-red);
  --text:var(--st-text);--muted:var(--st-muted);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--text);font-family:var(--font-sans);transition:background .2s ease,color .2s ease}
.app{display:flex;min-height:100vh}

/* ---------- Sidebar ---------- */
.side{
  width:245px;position:fixed;inset:0 auto 0 0;background:linear-gradient(180deg,var(--bg),var(--panel2));
  border-right:1px solid var(--line);padding:18px 13px;overflow:auto;z-index:40;transition:transform .25s ease
}
.brand{display:flex;gap:10px;align-items:center;padding:2px 8px 20px}
.brandlogo{width:42px;height:42px;border-radius:12px;background:linear-gradient(135deg,var(--orange),#c25e00);display:grid;place-items:center;font-size:20px}
.brand b{font-size:14px;letter-spacing:-.01em}
.brand b .accent{color:var(--st-orange-text)}
.brand small{display:block;color:var(--muted);font-size:9px;margin-top:3px}
.modebox{border:1px solid var(--blue);background:rgba(23,105,255,.1);border-radius:10px;padding:9px 11px;margin-bottom:13px;text-align:center;font-size:9.5px;font-weight:800;color:var(--st-blue-text);letter-spacing:.5px;text-transform:uppercase}
.nav{display:grid;gap:4px}
.nav button,.nav a{border:0;background:transparent;color:var(--muted);text-align:left;border-radius:9px;padding:11px 12px;font-size:12px;font-weight:600;display:flex;gap:10px;align-items:center;cursor:pointer;width:100%;font-family:inherit;text-decoration:none;box-sizing:border-box}
.nav button:hover,.nav a:hover{background:#ffffff08}
.nav button.active,.nav a.active{background:linear-gradient(90deg,var(--blue),#0c55d8);color:white}
.nav i{font-style:normal;width:19px;display:inline-flex;align-items:center;justify-content:center}
.nav i svg{width:17px;height:17px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.sep{font-size:8px;color:var(--muted);text-transform:uppercase;letter-spacing:1px;padding:14px 11px 6px}
.profile{margin-top:18px;background:var(--panel);border:1px solid var(--line);border-radius:11px;padding:11px}
.avatar{width:34px;height:34px;border-radius:50%;background:#e8edf4;color:#111;display:grid;place-items:center;font-weight:800;font-size:12px}
.pro{display:flex;gap:9px;align-items:center}
.profile small{color:var(--muted);font-size:9px;display:block}
.online{color:var(--green);font-size:9px;margin-top:8px}
.theme-toggle{
  width:100%;margin-top:12px;padding:9px 10px;border-radius:8px;border:1px solid var(--line);
  background:var(--panel);color:var(--muted);font-size:10.5px;font-weight:700;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:7px;font-family:inherit
}
.theme-toggle:hover{border-color:var(--blue)}

/* ---------- Main ---------- */
.main{margin-left:245px;width:calc(100% - 245px)}
.top{height:60px;border-bottom:1px solid var(--line);background:var(--bg);display:flex;align-items:center;padding:0 20px;gap:14px;position:sticky;top:0;z-index:20}
.hamburger{display:none;border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:9px;padding:9px 11px;cursor:pointer}
.fill{flex:1}
.logoutbtn{
  border:none;background:var(--orange);color:white;border-radius:9px;padding:9px 15px;font-size:11px;
  text-decoration:none;font-weight:700;display:inline-flex;align-items:center;gap:6px
}
.logoutbtn:hover{opacity:.9}
.logoutbtn svg{width:14px;height:14px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.content{padding:22px;max-width:1400px;margin:auto}
.head{display:flex;justify-content:space-between;gap:12px;align-items:flex-start;margin-bottom:18px;flex-wrap:wrap}
.head h1{font-size:21px;margin:0 0 5px}
.head p{font-size:11px;color:var(--muted);margin:0}

/* ---------- Composants partages ---------- */
.grid{display:grid;gap:13px}
.kpis{grid-template-columns:repeat(4,1fr)}
.card{background:linear-gradient(145deg,var(--panel),var(--panel));border:1px solid var(--line);border-radius:11px;padding:16px;box-shadow:0 12px 35px #0005;overflow-x:auto}
.kpi{min-height:100px}
.label{color:var(--muted);font-size:9px;text-transform:uppercase;font-weight:800;letter-spacing:.3px}
.val{font-size:21px;font-weight:800;margin:9px 0 5px}
.hint{font-size:9.5px;color:var(--muted)}
.hint.blue{color:var(--st-blue-text)}
.hint.orange{color:var(--st-orange-text)}
.hint.green{color:var(--st-green-text)}
.card h3{font-size:13px;margin:0 0 14px}

.action{border:1px solid var(--line);background:var(--panel);color:var(--text);border-radius:8px;padding:10px 16px;text-align:center;font-size:11px;cursor:pointer;font-family:inherit;text-decoration:none;display:inline-block}
.action:hover{border-color:var(--blue)}

table{width:100%;border-collapse:collapse;font-size:13.5px}
th{color:var(--muted);text-transform:uppercase;font-size:10.5px;text-align:left;padding:11px 10px;border-bottom:1px solid var(--line)}
td{padding:12px 10px;border-bottom:1px solid var(--line)}
.status{font-size:8.5px;padding:4px 8px;border-radius:99px;background:#103b2b;color:#52dfa0;font-weight:700}
.status.muted{background:var(--line);color:var(--muted)}

.backdrop{display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);z-index:30}

{% block extra_style %}{% endblock %}

@media(max-width:1100px){.kpis{grid-template-columns:repeat(2,1fr)}}
@media(max-width:900px){
  .side{transform:translateX(-100%)}
  .side.open{transform:translateX(0)}
  .main{margin-left:0;width:100%}
  .hamburger{display:block}
  .backdrop.open{display:block}
  .content{padding:14px}
}
</style>
</head>
<body>
<div class="app">

  <div class="backdrop" id="backdrop" onclick="closeSidebar()"></div>

  <aside class="side" id="sidebar">
    <div class="brand">
      <div class="brandlogo"><svg viewBox="0 0 24 24" width="22" height="22" stroke="white" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z"/></svg></div>
      <div><b>Station<span class="accent">Track</span></b><small>MANAGEMENT PLATFORM</small></div>
    </div>
    <div class="modebox">Super Admin</div>
    <nav class="nav">
      <a href="{% url 'platform_admin:dashboard' %}" class="{% if vue_active == 'dashboard' %}active{% endif %}"><i><svg viewBox="0 0 24 24"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/><polyline points="9 22 9 12 15 12 15 22"/></svg></i><span>Tableau de bord</span></a>
      <a href="{% url 'platform_admin:admin_societes' %}" class="{% if vue_active == 'societes' %}active{% endif %}"><i><svg viewBox="0 0 24 24"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg></i><span>Sociétés</span></a>
      <button data-v="soon" data-label="Stations"><i><svg viewBox="0 0 24 24"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z"/></svg></i><span>Stations</span></button>
      <button data-v="soon" data-label="Utilisateurs"><i><svg viewBox="0 0 24 24"><path d="M17 21v-2a4 4 0 0 0-4-4H7a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg></i><span>Utilisateurs</span></button>
      <div class="sep">Pilotage</div>
      <button data-v="soon" data-label="Abonnements"><i><svg viewBox="0 0 24 24"><rect x="1" y="4" width="22" height="16" rx="2"/><line x1="1" y1="10" x2="23" y2="10"/></svg></i><span>Abonnements</span></button>
      <button data-v="soon" data-label="Bases de données"><i><svg viewBox="0 0 24 24"><ellipse cx="12" cy="5" rx="9" ry="3"/><path d="M3 5v14c0 1.66 4 3 9 3s9-1.34 9-3V5"/><path d="M3 12c0 1.66 4 3 9 3s9-1.34 9-3"/></svg></i><span>Bases de données</span></button>
      <button data-v="soon" data-label="Analytics"><i><svg viewBox="0 0 24 24"><line x1="18" y1="20" x2="18" y2="10"/><line x1="12" y1="20" x2="12" y2="4"/><line x1="6" y1="20" x2="6" y2="14"/></svg></i><span>Analytics</span></button>
      <button data-v="soon" data-label="Journal d'activités"><i><svg viewBox="0 0 24 24"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/><line x1="16" y1="13" x2="8" y2="13"/><line x1="16" y1="17" x2="8" y2="17"/></svg></i><span>Journal d'activités</span></button>
      <button data-v="soon" data-label="Paramètres"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-4 0v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1 0-4h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></i><span>Paramètres</span></button>
      <button data-v="soon" data-label="Support"><i><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"/><line x1="12" y1="17" x2="12.01" y2="17"/></svg></i><span>Support</span></button>
    </nav>
    <div class="profile">
      <div class="pro">
        <div class="avatar">{{ super_admin.nom_complet|slice:":2"|upper }}</div>
        <div><b style="font-size:10px">{{ super_admin.nom_complet }}</b><small>Super Admin</small></div>
      </div>
      <div class="online">● En ligne</div>
      <button class="theme-toggle" id="themeToggle" type="button">
        <span id="themeIcon" style="display:inline-flex;width:15px;height:15px;">
          <svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
        </span>
        <span id="themeLabel">Mode clair</span>
      </button>
    </div>
  </aside>

  <main class="main">
    <header class="top">
      <button class="hamburger" onclick="openSidebar()"><svg viewBox="0 0 24 24" width="18" height="18" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg></button>
      <div class="fill"></div>
      <a class="logoutbtn" href="{% url 'platform_admin:logout' %}"><svg viewBox="0 0 24 24"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg> Déconnexion</a>
    </header>

    <div class="content">
      {% block content %}{% endblock %}
    </div>
  </main>
</div>

<script>
const soonButtons = document.querySelectorAll('.nav button[data-v="soon"]');
soonButtons.forEach(b => b.onclick = () => alert(b.dataset.label + " — fonctionnalité à venir."));

const sidebar = document.getElementById('sidebar');
const backdrop = document.getElementById('backdrop');
function openSidebar() { sidebar.classList.add('open'); backdrop.classList.add('open'); }
function closeSidebar() { sidebar.classList.remove('open'); backdrop.classList.remove('open'); }

const themeToggle = document.getElementById('themeToggle');
const themeLabel = document.getElementById('themeLabel');
const themeIconSun = '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="5"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>';
const themeIconMoon = '<svg viewBox="0 0 24 24" width="15" height="15" stroke="currentColor" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>';

function appliquerTheme(theme) {
  if (theme === 'light') {
    document.documentElement.setAttribute('data-theme', 'light');
    themeLabel.textContent = 'Mode sombre';
    document.getElementById('themeIcon').innerHTML = themeIconMoon;
  } else {
    document.documentElement.removeAttribute('data-theme');
    themeLabel.textContent = 'Mode clair';
    document.getElementById('themeIcon').innerHTML = themeIconSun;
  }
}

const themeStocke = localStorage.getItem('stationtrack_theme');
if (themeStocke) appliquerTheme(themeStocke);

themeToggle.addEventListener('click', () => {
  const actuel = document.documentElement.getAttribute('data-theme') === 'light' ? 'light' : 'dark';
  const nouveau = actuel === 'light' ? 'dark' : 'light';
  appliquerTheme(nouveau);
  localStorage.setItem('stationtrack_theme', nouveau);
});

{% block extra_script %}{% endblock %}
</script>
</body>
</html>
