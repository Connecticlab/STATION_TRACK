<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>StationTrack — Administration</title>
<link rel="stylesheet" href="/static/css/design-system.css">
<style>
:root{
  --bg:var(--st-bg);--panel:var(--st-panel);--panel2:var(--st-panel-2);--line:var(--st-line);
  --blue:var(--st-blue);--orange:var(--st-orange);--text:var(--st-text);--muted:var(--st-muted);
}
*{box-sizing:border-box}
body{
  margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
  background:var(--bg);color:var(--text);font-family:var(--font-sans);padding:20px;
}
.card{
  width:100%;max-width:380px;background:var(--panel);border:1px solid var(--line);
  border-radius:16px;padding:32px 28px;box-shadow:0 20px 60px #0007;
}
.brand{display:flex;flex-direction:column;align-items:center;gap:10px;margin-bottom:24px;}
.brandlogo{
  width:52px;height:52px;border-radius:14px;background:linear-gradient(135deg,var(--orange),#c25e00);
  display:grid;place-items:center;
}
.brand b{font-size:16px;}
.brand .accent{color:var(--st-orange-text);}
.brand small{color:var(--muted);font-size:9px;letter-spacing:.8px;text-transform:uppercase;margin-top:2px;}
.modebox{
  border:1px solid var(--blue);background:rgba(23,105,255,.1);border-radius:10px;padding:8px 12px;
  text-align:center;font-size:10px;font-weight:800;color:var(--st-blue-text);letter-spacing:.5px;
  text-transform:uppercase;margin-bottom:20px;
}
.field{margin-bottom:16px;}
.field label{display:block;font-size:10.5px;font-weight:700;text-transform:uppercase;letter-spacing:.4px;color:var(--muted);margin-bottom:7px;}
.field input{
  width:100%;height:46px;background:var(--panel2);border:1px solid var(--line);border-radius:9px;
  color:var(--text);font-size:14px;padding:0 13px;font-family:inherit;
}
.field input:focus{outline:none;border-color:var(--blue);}
.big-btn{
  width:100%;height:48px;border:0;border-radius:10px;background:var(--blue);color:white;
  font-weight:800;font-size:14px;cursor:pointer;font-family:inherit;margin-top:6px;
}
.big-btn:hover{opacity:.92;}
.error-banner{
  background:var(--st-red-bg);border:1px solid rgba(255,84,112,.32);color:var(--st-red-text);
  border-radius:9px;padding:11px 13px;font-size:12.5px;margin-bottom:16px;
}
</style>
</head>
<body>
<div class="card">
  <div class="brand">
    <div class="brandlogo"><svg viewBox="0 0 24 24" width="24" height="24" stroke="white" fill="none" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 2C12 2 5 10.5 5 15a7 7 0 0 0 14 0c0-4.5-7-13-7-13z"/></svg></div>
    <b>Station<span class="accent">Track</span></b>
    <small>Management Platform</small>
  </div>
  <div class="modebox">Super Admin</div>

  {% if erreur %}
    <div class="error-banner">{{ erreur }}</div>
  {% endif %}

  <form method="post">
    {% csrf_token %}
    <div class="field">
      <label for="email">Email</label>
      <input type="email" id="email" name="email" required autofocus>
    </div>
    <div class="field">
      <label for="password">Mot de passe</label>
      <input type="password" id="password" name="password" required>
    </div>
    <button type="submit" class="big-btn">Se connecter</button>
  </form>
</div>
</body>
</html>
